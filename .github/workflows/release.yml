name: Release

# Push a tag vX.Y.Z (release) or vX.Y.Z-rc.N (pre-release). X.Y.Z must match the
# version in Cargo.toml. Releases need a CHANGELOG section for X.Y.Z; pre-releases use
# it if present, are marked as pre-release on GitHub and do not update the Homebrew tap.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: macos-15-intel # builds both slices; arm64 runner capacity was unreliable
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Version, tag and changelog agree
        id: version
        run: |
          scripts/release-version.sh "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          eval "$(scripts/release-version.sh "$GITHUB_REF_NAME")"
          if scripts/changelog-section.sh "$VERSION" > "$RUNNER_TEMP/notes.md" 2>/dev/null; then
            :
          elif [ "$PRERELEASE" = true ]; then
            printf 'Pre-release of battbar %s. Not yet described in CHANGELOG.md.\n' "$VERSION" > "$RUNNER_TEMP/notes.md"
          else
            echo "CHANGELOG.md has no section for [$VERSION]" >&2
            exit 1
          fi
          if [ "$PRERELEASE" = true ]; then
            printf '\n> Pre-release for testing; not published to the Homebrew tap.\n' >> "$RUNNER_TEMP/notes.md"
          fi

      - name: Tests
        run: cargo test --workspace

      - name: Build universal binaries
        env:
          # Compiled in (battbar-core build.rs): menus, --version, dump, update check.
          BATTBAR_RELEASE_VERSION: ${{ steps.version.outputs.RELEASE_VERSION }}
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --target "$t" -p battbar-app -p battbar-cli
          done
          mkdir -p target/universal
          for b in battbar-app battbar; do
            lipo -create -output "target/universal/$b" \
              "target/aarch64-apple-darwin/release/$b" "target/x86_64-apple-darwin/release/$b"
          done
          lipo -info target/universal/battbar-app
      - name: No development hooks in release binaries
        run: scripts/check-no-dev-hooks.sh target/universal/battbar-app target/universal/battbar

      # Signing: self-signed "battbar Release" certificate from secrets. Developer ID
      # signing and notarization can replace these two steps later.
      - name: Import signing certificate
        env:
          BATTBAR_RELEASE_P12_BASE64: ${{ secrets.BATTBAR_RELEASE_P12_BASE64 }}
          BATTBAR_RELEASE_P12_PASSWORD: ${{ secrets.BATTBAR_RELEASE_P12_PASSWORD }}
        run: scripts/ci-import-cert.sh
      - name: Bundle and sign
        env:
          BATTBAR_RELEASE_VERSION: ${{ steps.version.outputs.RELEASE_VERSION }}
          BATTBAR_BIN_DIR: target/universal
          BATTBAR_SIGN_IDENTITY: battbar Release
          BATTBAR_REQUIRE_IDENTITY: "1"
        run: scripts/bundle.sh
      - name: Signed by the pinned release certificate
        run: scripts/check-release-signature.sh target/battbar.app
      - name: Version in the bundle matches the tag
        run: scripts/check-bundle-version.sh target/battbar.app "${{ steps.version.outputs.RELEASE_VERSION }}"

      - name: Package (zip for Homebrew, disk image for manual installs)
        run: |
          V=${{ steps.version.outputs.RELEASE_VERSION }}
          mkdir -p dist
          ditto -c -k --keepParent target/battbar.app "dist/battbar-$V.zip"
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet dmgbuild==2.0.0
          DMGBUILD="$RUNNER_TEMP/dmgbuild/bin/dmgbuild" scripts/build-dmg.sh target/battbar.app "dist/battbar-$V.dmg"
          codesign --force --sign "battbar Release" --identifier io.github.battbar.dmg "dist/battbar-$V.dmg"
          codesign --verify --strict "dist/battbar-$V.dmg"
          (cd dist && shasum -a 256 "battbar-$V.zip" "battbar-$V.dmg" > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.PRERELEASE }}
        run: |
          FLAGS=""
          if [ "$PRERELEASE" = true ]; then FLAGS="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" dist/* $FLAGS \
            --title "battbar ${{ steps.version.outputs.RELEASE_VERSION }}" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Update Homebrew tap (releases only)
        if: steps.version.outputs.PRERELEASE == 'false'
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: scripts/update-cask.sh "${{ steps.version.outputs.VERSION }}" "$(grep -E ' battbar-[^ ]+\.zip$' dist/SHA256SUMS | cut -d' ' -f1)"

      - name: Remove signing keychain
        if: always()
        run: scripts/ci-cleanup-keychain.sh
