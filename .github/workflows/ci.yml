name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, tests (macOS)
    runs-on: macos-15-intel # arm64 macOS runners were repeatedly unavailable (capacity)
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the privacy check below scans every commit
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (recorded traces, no hardware)
        run: cargo test --workspace
      - name: Development hooks only in debug builds
        run: |
          cargo build -p battbar-app
          scripts/check-no-dev-hooks.sh --expect-present target/debug/battbar-app
          cargo build --release -p battbar-app -p battbar-cli
          scripts/check-no-dev-hooks.sh target/release/battbar-app target/release/battbar
      - name: SUPPORTED_DEVICES.md is up to date
        run: cargo xtask supported-devices --check
      - name: No certificates or keys in the repository
        run: scripts/check-no-secrets.sh
      - name: Whole history - no signing material, traces pseudonymized
        run: python3 scripts/check-history.py

  licenses:
    name: dependency licenses (cargo deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources advisories
