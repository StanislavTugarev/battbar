name: Works with my device
description: Tell us a device works, so it can be listed as "reported by users".
labels: ["works with"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Takes a minute. Devices reported here are listed in [SUPPORTED_DEVICES](../blob/main/docs/SUPPORTED_DEVICES.md) as "reported by users".
  - type: input
    id: device
    attributes:
      label: Device model
      placeholder: "Logitech MX Master 3S"
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connected via
      options:
        - Receiver (Logitech Lightspeed / Unifying / Bolt)
        - Base station / dongle
        - Bluetooth
        - USB cable
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model, macOS and battbar versions
      placeholder: "MacBook Pro M3, macOS 26.1, battbar 0.5.0"
    validations:
      required: true
  - type: textarea
    id: dump
    attributes:
      label: dump.txt (optional)
      description: "`battbar dump > ~/Desktop/dump.txt`, then drag the file here. See [what it contains](../blob/main/docs/ADDING_A_DEVICE.md#how-to-collect-diagnostics)."
