name: Device not detected / new device
description: battbar does not show a device, or you want a device added.
labels: ["device support"]
body:
  - type: markdown
    attributes:
      value: |
        Takes about 5 minutes. Diagnostics: [How to collect diagnostics](../blob/main/docs/ADDING_A_DEVICE.md#how-to-collect-diagnostics) — in short:
        `battbar --version`, `battbar dump > ~/Desktop/dump.txt`, and for about 2 minutes
        `battbar record --out ~/Desktop/trace.jsonl --polls 24 --interval 5` while you switch the device off and on, plug the charger in and out, and replug the receiver or base station.
  - type: input
    id: device
    attributes:
      label: Device model
      placeholder: "Logitech MX Keys S"
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connected via
      options:
        - Receiver (Logitech Lightspeed / Unifying / Bolt)
        - Base station / dongle
        - Bluetooth
        - USB cable
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model and macOS version
      placeholder: "MacBook Air M2, macOS 26.1"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: battbar version
      placeholder: "battbar 0.5.0"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what you see
      placeholder: "G HUB shows 57 %; battbar does not list the keyboard."
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: dump.txt and trace.jsonl
      description: Drag both files here.
    validations:
      required: true
