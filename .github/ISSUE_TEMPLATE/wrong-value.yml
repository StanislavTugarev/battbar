name: Wrong battery value
description: battbar shows a battery level that differs from the device or vendor app.
labels: ["battery value"]
body:
  - type: input
    id: device
    attributes:
      label: Device and connection
      placeholder: "Logitech G915 on Bluetooth"
    validations:
      required: true
  - type: input
    id: battbar
    attributes:
      label: What battbar shows
      placeholder: "~62 %"
    validations:
      required: true
  - type: input
    id: reference
    attributes:
      label: What the vendor app or device shows
      placeholder: "G HUB: 80 %"
    validations:
      required: true
  - type: dropdown
    id: charging
    attributes:
      label: Was the device charging or on a cable?
      options: ["No", "Yes", "Not sure"]
  - type: textarea
    id: files
    attributes:
      label: Dump and trace
      description: Attach `battbar dump --out battbar-dump.json` and `battbar record --out battbar-trace.jsonl --note "vendor app shows …"`.
    validations:
      required: true
