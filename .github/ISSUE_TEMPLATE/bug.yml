name: Bug
description: Something else does not work as expected.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: input
    id: versions
    attributes:
      label: battbar and macOS versions
      placeholder: "battbar 0.1.0, macOS 26.1, Apple Silicon"
    validations:
      required: true
  - type: textarea
    id: dump
    attributes:
      label: Diagnostic dump (optional)
      description: Attach `battbar dump --out battbar-dump.json` if devices are involved.
