[package]
name = "battbar-macos"
description = "battbar: thin macOS bindings (CoreBluetooth retrieve-only central, IOBluetooth, TCC helpers)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString", "NSData", "NSError", "NSUUID", "NSKeyValueCoding", "NSValue", "NSObject", "NSDictionary", "NSBundle"] }
objc2-core-bluetooth = { version = "0.3", features = ["CBCentralManager", "CBPeripheral", "CBService", "CBCharacteristic", "CBUUID", "CBManager", "CBPeer", "CBAttribute", "dispatch2"] }
objc2-io-bluetooth = { version = "0.3", features = ["IOBluetoothDevice", "objc2-foundation"] }
dispatch2 = "0.3"
libc = "0.2"

[dependencies]
thiserror = { workspace = true }
