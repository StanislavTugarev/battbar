[package]
name = "battbar-app"
description = "battbar menu bar app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "battbar-app"
path = "src/main.rs"

[dependencies]
battbar-core = { workspace = true }
battbar-hid = { workspace = true }
battbar-hidpp = { workspace = true }
battbar-steelseries = { workspace = true }
battbar-bt-system = { workspace = true }
battbar-macos = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSURL", "NSDate", "NSThread", "NSObject", "NSDictionary", "NSAttributedString", "NSError", "NSRunLoop", "NSTimer", "NSGeometry", "NSValue", "NSBundle", "NSUserDefaults", "NSEnumerator", "NSData", "NSNotification", "NSOperation", "NSProcessInfo"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSRunningApplication", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSMenu", "NSMenuItem", "NSImage", "NSAlert", "NSWorkspace", "NSCell", "NSButtonCell", "NSWindow", "NSFont", "NSAttributedString", "NSColor", "NSText", "NSGraphics", "NSPasteboard", "NSStringDrawing", "NSFontDescriptor", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "NSScreen", "block2", "objc2-core-foundation"] }
objc2-user-notifications = { version = "0.3", features = ["UNUserNotificationCenter", "UNNotificationRequest", "UNNotificationContent", "UNNotificationTrigger", "UNNotificationSettings", "block2"] }
objc2-service-management = { version = "0.3", features = ["SMAppService"] }
block2 = "0.6"
dispatch2 = "0.3"
libc = "0.2"
