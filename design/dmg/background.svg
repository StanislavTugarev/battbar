<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420">
  <!-- DMG window background. Icons are placed by packaging/dmg/settings.py at
       (165, 205) for battbar.app and (495, 205) for the Applications link. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EEF0FA"/>
    </linearGradient>
    <linearGradient id="p" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A93F7"/><stop offset="1" stop-color="#9673E6"/>
    </linearGradient>
  </defs>
  <rect width="660" height="420" fill="url(#bg)"/>
  <text x="330" y="62" text-anchor="middle" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif"
        font-size="22" font-weight="600" fill="#2E3242">Drag battbar to Applications</text>
  <text x="330" y="90" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif"
        font-size="13" fill="#6B7080">then open it from the Applications folder</text>
  <!-- arrow between the two icons -->
  <path d="M 262 205 C 300 178, 360 178, 398 205" fill="none" stroke="url(#p)" stroke-width="6" stroke-linecap="round"/>
  <path d="M 384 188 L 402 208 L 377 214" fill="none" stroke="#9673E6" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="330" y="372" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif"
        font-size="11" fill="#9A9EAD">battbar · battery indicators for wireless devices · GPL-3.0-or-later</text>
</svg>
