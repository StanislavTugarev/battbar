# Logitech HID++ 2.0 devices. Devices that are not listed still work: names, type and
# battery features are read from the device itself. Entries add PIDs per transport,
# calibrated voltage curves and notes.

[[device]]
name = "G915 Wireless Mechanical Gaming Keyboard"
kind = "keyboard"
protocol = "hidpp20"
vendor_id = 0x046D
wpid = [0x407C]
ble_pid = [0xB354]
usb_pid = [0xC33E]
# Its BLE Battery Service kept reporting 100 % from 4148 mV down to 4054 mV, while
# G HUB showed 91 % (2026-11-20); macOS's own Bluetooth battery shows the same 100 %.
ble_battery_service_unreliable = true
notes = "Battery via 0x1001 (voltage) only; no serial number. Verified on Lightspeed and BLE (GATT). The BLE Battery Service value is not used (stays at 100 %)."

[[device]]
name = "G502 X PLUS"
kind = "mouse"
protocol = "hidpp20"
vendor_id = 0x046D
wpid = [0x4099]
usb_pid = [0xC095]
notes = "Battery via 0x1004 (Unified Battery), exact percentage. Verified on Lightspeed."

[[device]]
name = "Pebble Keys 2 K380s"
kind = "keyboard"
protocol = "hidpp20"
vendor_id = 0x046D
ble_pid = [0xB377]
notes = "2× AAA. Battery via 0x1004 (percentage from the firmware). Verified on Bluetooth LE."
